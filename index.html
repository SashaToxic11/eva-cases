<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллекция гифок с Евой🌸 | Рулетка</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Gradient Borders & Glows for all rarities */
        
        /* 1. Обычная (Голубой) */
        .rarity-consumer { 
            border-color: #3b82f6; 
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.25) 0%, rgba(15, 23, 42, 0.95) 100%); 
            box-shadow: inset 0 0 12px rgba(59, 130, 246, 0.2);
        }

        /* 2. Редкая (Фиолетовый) */
        .rarity-mil-spec { 
            border-color: #a855f7; 
            background: linear-gradient(180deg, rgba(168, 85, 247, 0.25) 0%, rgba(15, 23, 42, 0.95) 100%); 
            box-shadow: inset 0 0 12px rgba(168, 85, 247, 0.2);
        }

        /* 3. Мифическая (Розово-красный) */
        .rarity-restricted { 
            border-color: #f43f5e; 
            background: linear-gradient(180deg, rgba(225, 29, 72, 0.3) 0%, rgba(15, 23, 42, 0.95) 100%); 
            box-shadow: inset 0 0 15px rgba(225, 29, 72, 0.25);
        }

        /* 4. Легендарная (Золотой/Желтый) */
        .rarity-classified { 
            border-color: #eab308; 
            background: linear-gradient(180deg, rgba(234, 179, 8, 0.3) 0%, rgba(15, 23, 42, 0.95) 100%); 
            box-shadow: inset 0 0 15px rgba(234, 179, 8, 0.25);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Smooth reel transform transitions */
        .reel-track {
            display: flex;
            will-change: transform;
        }

        @keyframes pulse-marker {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.9; }
            50% { transform: translateX(-50%) scale(1.15); opacity: 1; }
        }
        .marker-pulse { animation: pulse-marker 1.5s infinite; }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-rose-500 selection:text-slate-950">

    <!-- Navbar -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-amber-300 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-rose-500/20">
                    🌸
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wider uppercase bg-gradient-to-r from-rose-400 via-pink-400 to-amber-300 bg-clip-text text-transparent">
                        Рулетка с Евой🌸
                    </h1>
                    <p class="text-xs text-slate-400 font-medium">Открывай кейсы и собирай гифки</p>
                </div>
            </div>

            <!-- Sound Control -->
            <div class="flex items-center space-x-3 sm:space-x-6">
                <button id="soundToggleBtn" onclick="toggleSound()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition flex items-center gap-2 text-xs font-semibold border border-slate-700">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-rose-400"></i>
                    <span id="soundText" class="hidden sm:inline">Звук: ВКЛ</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-8">

        <!-- CASE OPENING ROULETTE SECTION -->
        <section class="bg-slate-900/70 border border-slate-800/80 rounded-3xl p-4 sm:p-6 shadow-2xl relative overflow-hidden backdrop-blur-sm">
            <!-- Background Radial Glow -->
            <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-xl font-extrabold text-slate-100 flex items-center gap-2">
                        <i class="fa-solid fa-box-open text-rose-400"></i>
                        Коллекция гифок с Евой🌸
                    </h2>
                    <p class="text-xs text-slate-400 mt-0.5">Испытай удачу и выбей редкие анимации!</p>
                </div>

                <!-- Odds Pill -->
                <div class="flex flex-wrap items-center justify-center gap-2 text-[11px] font-semibold">
                    <span class="px-2.5 py-1 rounded bg-gradient-to-r from-blue-600 to-cyan-600 border border-blue-400 text-white font-bold shadow-md shadow-blue-500/20">Обычная 50%</span>
                    <span class="px-2.5 py-1 rounded bg-gradient-to-r from-purple-600 to-indigo-600 border border-purple-400 text-white font-bold shadow-md shadow-purple-500/20">Редкая 25%</span>
                    <span class="px-2.5 py-1 rounded bg-gradient-to-r from-rose-600 to-pink-600 border border-rose-400 text-white font-bold shadow-md shadow-rose-600/30">Мифическая 10%</span>
                    <span class="px-2.5 py-1 rounded bg-gradient-to-r from-amber-500 to-yellow-400 border border-amber-300 text-slate-950 font-black shadow-md shadow-amber-500/30">👑 Легендарная 5%</span>
                </div>
            </div>

            <!-- ROULETTE VIEWPORT -->
            <div class="relative w-full h-48 sm:h-56 bg-slate-950 border-2 border-slate-800 rounded-2xl overflow-hidden shadow-inner flex items-center">
                <!-- Top & Bottom Center Pointer Markers -->
                <div class="absolute top-0 left-1/2 z-20 -translate-x-1/2 w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[18px] border-t-amber-400 marker-pulse filter drop-shadow-[0_2px_8px_rgba(251,191,36,0.8)]"></div>
                <div class="absolute bottom-0 left-1/2 z-20 -translate-x-1/2 w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-b-[18px] border-b-amber-400 marker-pulse filter drop-shadow-[0_-2px_8px_rgba(251,191,36,0.8)]"></div>

                <!-- Center Indicator Line -->
                <div class="absolute top-0 bottom-0 left-1/2 z-10 w-0.5 bg-gradient-to-b from-amber-300 via-amber-400 to-amber-500 -translate-x-1/2 shadow-[0_0_12px_#fbbf24]"></div>

                <!-- Dark Vignette Overlay -->
                <div class="absolute inset-0 pointer-events-none z-10 bg-gradient-to-r from-slate-950 via-transparent to-slate-950 opacity-90"></div>

                <!-- REEL TRACK -->
                <div id="reelTrack" class="reel-track absolute left-0 flex items-center gap-3 px-4">
                    <!-- Items generated by JS -->
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-4">
                <button id="openCaseBtn" onclick="openCase()" class="w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-black text-lg uppercase tracking-wider rounded-2xl shadow-xl shadow-amber-500/20 transform transition active:scale-95 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-gift text-xl"></i>
                    Открыть кейс
                </button>
                <button id="quickOpenBtn" onclick="openCase(true)" class="w-full sm:w-auto px-6 py-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm uppercase tracking-wider rounded-2xl border border-slate-700 transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bolt text-amber-400"></i>
                    Быстрое открытие
                </button>
            </div>
        </section>

        <!-- POSSIBLE ITEMS CONTAINED IN CASE -->
        <section class="bg-slate-900/50 border border-slate-800/60 rounded-3xl p-5 mb-8">
            <h3 class="text-sm font-extrabold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-cubes text-rose-400"></i>
                Содержимое кейса
            </h3>
            <div id="casePreviewGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                <!-- Preview items dynamically filled by JS -->
            </div>
        </section>
    </main>

    <!-- WIN MODAL -->
    <div id="winModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="winModalCard" class="bg-slate-900 border-2 border-slate-700 rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl transform scale-90 transition-transform duration-300 relative overflow-hidden">
            <div id="winGlowBg" class="absolute inset-0 opacity-20 pointer-events-none"></div>

            <div class="relative z-10 flex flex-col items-center">
                <span id="winCategoryBadge" class="px-3 py-1 text-xs font-black uppercase rounded-full border mb-4"></span>

                <div id="winIconContainer" class="w-36 h-36 sm:w-44 sm:h-44 rounded-2xl border-2 flex items-center justify-center p-3 mb-4 bg-slate-950 relative shadow-2xl">
                    <div id="winMediaContainer" class="w-full h-full flex items-center justify-center"></div>
                </div>

                <h3 id="winTitle" class="text-xl sm:text-2xl font-black text-slate-100 mb-1"></h3>
                <p id="winRarityText" class="text-xs font-semibold mb-6"></p>

                <div class="flex gap-3 w-full">
                    <button onclick="closeWinModal()" class="flex-1 py-3 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-extrabold text-sm uppercase rounded-xl transition shadow-lg shadow-amber-500/20">
                        Закрыть
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- AUDIO SYNTHESIS & LOGIC SCRIPT -->
    <script>
        // RARITY DATA & COLORS
        const RARITIES = {
            consumer: { 
                name: 'Обычная', 
                color: '#3b82f6', 
                badgeBg: 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white border-blue-400 font-bold shadow-md shadow-blue-500/20', 
                class: 'rarity-consumer', 
                weight: 50 
            },
            milSpec: { 
                name: 'Редкая', 
                color: '#a855f7', 
                badgeBg: 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white border-purple-400 font-bold shadow-md shadow-purple-500/20', 
                class: 'rarity-mil-spec', 
                weight: 25 
            },
            restricted: { 
                name: 'Мифическая', 
                color: '#f43f5e', 
                badgeBg: 'bg-gradient-to-r from-rose-600 to-pink-600 text-white border-rose-400 font-bold shadow-md shadow-rose-600/30', 
                class: 'rarity-restricted', 
                weight: 10 
            },
            classified: { 
                name: 'Легендарная', 
                color: '#eab308', 
                badgeBg: 'bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 border-amber-300 font-black shadow-md shadow-amber-500/30', 
                class: 'rarity-classified', 
                weight: 5 
            }
        };

        // ITEMS LIST
        // ВАЖНО: положи свои видеофайлы в папку media/ рядом с этим index.html
        // под именно такими именами (или поменяй video: "..." на свои имена файлов)
        const CASE_ITEMS = [
            { id: 1, name: 'Гифка #1', rarity: 'consumer',  video: 'media/consumer_1.mp4' },
            { id: 2, name: 'Гифка #2', rarity: 'consumer',  video: 'media/consumer_2.mp4' },
            { id: 3, name: 'Гифка #3', rarity: 'milSpec',   video: 'media/rare_1.mp4' },
            { id: 4, name: 'Гифка #4', rarity: 'milSpec',   video: 'media/rare_2.mp4' },
            { id: 5, name: 'Гифка #5', rarity: 'restricted', video: 'media/mythic_1.mp4' },
            { id: 6, name: 'Гифка #6', rarity: 'classified', video: 'media/legendary_1.mp4' }
        ];

        // STATE
        let isMuted = false;
        let isSpinning = false;
        let audioCtx = null;

        // CARD CONFIGURATION
        const CARD_WIDTH = 130;
        const GAP = 12;
        const ITEM_SPAN = CARD_WIDTH + GAP;
        const REEL_SIZE = 75;
        const WIN_INDEX = 58;

        let generatedReelItems = [];

        // WEB AUDIO API
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playTickSound() {
            if (isMuted) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.03);

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.03);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.035);
            } catch (e) { console.error(e); }
        }

        function playWinSound(rarityKey) {
            if (isMuted) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const now = ctx.currentTime;
                const isRare = rarityKey === 'classified' || rarityKey === 'restricted';

                const notes = isRare ? [523.25, 659.25, 783.99, 1046.50] : [330, 392, 493.88];
                notes.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = isRare ? 'sawtooth' : 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.1);

                    gain.gain.setValueAtTime(0.2, now + index * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.6);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + index * 0.1);
                    osc.stop(now + index * 0.1 + 0.65);
                });
            } catch (e) { console.error(e); }
        }

        function toggleSound() {
            isMuted = !isMuted;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');

            if (isMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-slate-500';
                text.innerText = 'Звук: ВЫКЛ';
            } else {
                icon.className = 'fa-solid fa-volume-high text-rose-400';
                text.innerText = 'Звук: ВКЛ';
                getAudioContext();
            }
        }

        // ROLL WEIGHTED ITEM
        function getRandomWeightedItem() {
            const totalWeight = Object.values(RARITIES).reduce((acc, r) => acc + r.weight, 0);
            let random = Math.random() * totalWeight;

            let chosenRarity = 'consumer';
            for (const [key, rarity] of Object.entries(RARITIES)) {
                if (random < rarity.weight) {
                    chosenRarity = key;
                    break;
                }
                random -= rarity.weight;
            }

            const matchingItems = CASE_ITEMS.filter(item => item.rarity === chosenRarity);
            if (matchingItems.length > 0) {
                return matchingItems[Math.floor(Math.random() * matchingItems.length)];
            }
            return CASE_ITEMS[0];
        }

        // UI RENDERING
        function renderCasePreview() {
            const grid = document.getElementById('casePreviewGrid');
            grid.innerHTML = CASE_ITEMS.map(item => {
                const rarity = RARITIES[item.rarity];
                return `
                    <div class="bg-slate-950/80 border-2 ${rarity.class} rounded-2xl p-3 flex flex-col items-center text-center shadow-lg transform transition hover:-translate-y-1">
                        <video class="w-16 h-16 my-2 object-cover rounded-lg" src="${item.video}" muted loop autoplay playsinline></video>
                        <span class="text-[10px] uppercase px-2 py-0.5 rounded-md ${rarity.badgeBg} mb-1">${rarity.name}</span>
                        <span class="text-xs font-extrabold text-slate-200 truncate w-full">${item.name}</span>
                    </div>
                `;
            }).join('');
        }

        function buildReel() {
            const track = document.getElementById('reelTrack');
            generatedReelItems = [];

            for (let i = 0; i < REEL_SIZE; i++) {
                generatedReelItems.push(getRandomWeightedItem());
            }

            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            track.innerHTML = generatedReelItems.map((item, idx) => {
                const rarity = RARITIES[item.rarity];
                return `
                    <div id="reel-item-${idx}" class="w-[130px] h-36 sm:h-44 flex-shrink-0 bg-slate-950/90 border-2 ${rarity.class} rounded-2xl p-2.5 flex flex-col items-center justify-between text-center relative shadow-md select-none">
                        <span class="text-[10px] uppercase px-2 py-0.5 rounded ${rarity.badgeBg}">${rarity.name}</span>
                        <video class="w-20 h-20 my-auto object-cover rounded-lg" src="${item.video}" muted loop autoplay playsinline></video>
                        <span class="text-xs font-extrabold text-slate-200 truncate w-full">${item.name}</span>
                    </div>
                `;
            }).join('');
        }

        // ROULETTE SPIN LOGIC
        function openCase(isQuick = false) {
            if (isSpinning) return;

            getAudioContext();
            isSpinning = true;

            const openBtn = document.getElementById('openCaseBtn');
            const quickBtn = document.getElementById('quickOpenBtn');
            openBtn.disabled = true;
            quickBtn.disabled = true;
            openBtn.classList.add('opacity-50', 'cursor-not-allowed');
            quickBtn.classList.add('opacity-50', 'cursor-not-allowed');

            buildReel();

            const winnerItem = generatedReelItems[WIN_INDEX];
            const track = document.getElementById('reelTrack');
            const viewport = track.parentElement;
            const viewportWidth = viewport.offsetWidth;

            const randomInnerOffset = (Math.random() * 80) - 40;
            const winningCardOffset = (WIN_INDEX * ITEM_SPAN) + (CARD_WIDTH / 2);
            const targetPosition = winningCardOffset - (viewportWidth / 2) + randomInnerOffset;

            const spinDuration = isQuick ? 1.2 : 6.0;

            track.style.transition = `transform ${spinDuration}s cubic-bezier(0.12, 0.8, 0.15, 1)`;
            track.style.transform = `translateX(-${targetPosition}px)`;

            let lastTickIndex = -1;
            const startTime = performance.now();

            function checkTickPosition() {
                if (!isSpinning) return;

                const elapsed = (performance.now() - startTime) / 1000;
                const progress = Math.min(elapsed / spinDuration, 1);

                const easedProgress = 1 - Math.pow(1 - progress, 3);
                const currentTranslate = targetPosition * easedProgress;

                const currentCenterPos = currentTranslate + (viewportWidth / 2);
                const currentCardIdx = Math.floor(currentCenterPos / ITEM_SPAN);

                if (currentCardIdx !== lastTickIndex && currentCardIdx >= 0 && currentCardIdx < REEL_SIZE) {
                    playTickSound();
                    lastTickIndex = currentCardIdx;
                }

                if (progress < 1) {
                    requestAnimationFrame(checkTickPosition);
                }
            }

            requestAnimationFrame(checkTickPosition);

            setTimeout(() => {
                isSpinning = false;

                playWinSound(winnerItem.rarity);
                showWinModal(winnerItem);

                openBtn.disabled = false;
                quickBtn.disabled = false;
                openBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                quickBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }, spinDuration * 1000 + 100);
        }

        // WIN MODAL
        function showWinModal(item) {
            const modal = document.getElementById('winModal');
            const card = document.getElementById('winModalCard');
            const rarity = RARITIES[item.rarity];

            document.getElementById('winCategoryBadge').className = `px-3 py-1 text-xs uppercase rounded-full border ${rarity.badgeBg}`;
            document.getElementById('winCategoryBadge').innerText = rarity.name;

            document.getElementById('winIconContainer').className = `w-36 h-36 sm:w-44 sm:h-44 rounded-2xl border-2 flex items-center justify-center p-3 mb-4 bg-slate-950 relative shadow-2xl ${rarity.class}`;

            document.getElementById('winMediaContainer').innerHTML = `<video class="w-40 h-40 sm:w-48 sm:h-48 object-cover rounded-xl mx-auto" src="${item.video}" autoplay loop controls playsinline></video>`;
            document.getElementById('winTitle').innerText = item.name;

            const rarityText = document.getElementById('winRarityText');
            rarityText.style.color = rarity.color;
            rarityText.innerText = `Редкость: ${rarity.name}`;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-90');
            card.classList.add('scale-100');
        }

        function closeWinModal() {
            const modal = document.getElementById('winModal');
            const card = document.getElementById('winModalCard');

            card.classList.remove('scale-100');
            card.classList.add('scale-90');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // INIT ON LOAD
        window.addEventListener('DOMContentLoaded', () => {
            renderCasePreview();
            buildReel();
        });
    
        // --- TELEGRAM MINI APP ---
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            // Подстраиваем фон сайта под тему Telegram (необязательно, можно убрать)
            if (tg.setHeaderColor) tg.setHeaderColor('#020617');
        }
</script>
</body>
</html>
